  - "BMAD"
  - "NLHD 教材"
difficulty: "入门"
duration: "半天起（M0-ABC 6 次课 / 17h+）"
content:
  items:
    - phase: "M0-A 感知"
      description: "用 Grove 套件在 Codecraft 完成第一个可运行原型，建立“感知→逻辑→输出”心智模型，掌握 AI 辅助编程 5 大法则"
    - phase: "M0-B 交互"
      description: "用 Wio Terminal 彩屏实现人机交互界面，以 BMAD 5 角色工作流（PM/UX/架构/开发/测试）完成有结构的完整项目（如智能番茄钟）"
    - phase: "M0-C 视觉"
      description: "用 XIAO ESP32S3 Sense 摄像头实现图像分类与边缘 AI 推理，体验 SenseCraft AI 无代码模型部署"
